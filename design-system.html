<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birch Design System</title>
<link rel="icon" href="data:,">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="The Birch design system: the app's screens as they ship, alternative directions in light and dark, a tuning panel, and comments that export as a change request for Claude Code.">
<style>
/* Page chrome: neutral graphite so the options carry all the color.
   Layout: sticky toolbar, section rail, content column, floating tuning panel. */
:root {
  --x-bg: #F3F4F2; --x-panel: #FFFFFF; --x-panel2: #EBEDEA; --x-ink: #161917; --x-ink2: #575D59; --x-ink3: #868C88;
  --x-line: #DFE2DE; --x-line2: #C6CBC6; --x-sel: #161917; --x-onsel: #FFFFFF; --x-pin: #2563EB; --x-onpin: #FFFFFF;
  --x-ok: #1E7A43; --x-bad: #B42318; --x-shadow: 0 1px 2px rgba(20,24,22,.06), 0 8px 28px rgba(20,24,22,.10);
  --x-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  --x-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  --x-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --zoom: 0.66;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --x-bg: #0D0F0E; --x-panel: #161918; --x-panel2: #1F2321; --x-ink: #EBEEEC; --x-ink2: #A1A8A4; --x-ink3: #6F7672;
  --x-line: #252927; --x-line2: #353A37; --x-sel: #EBEEEC; --x-onsel: #0D0F0E; --x-pin: #5B8CFF; --x-onpin: #0B1220;
  --x-ok: #4CC27A; --x-bad: #FF7A6E; --x-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 36px rgba(0,0,0,.45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --x-bg: #0D0F0E; --x-panel: #161918; --x-panel2: #1F2321; --x-ink: #EBEEEC; --x-ink2: #A1A8A4; --x-ink3: #6F7672;
  --x-line: #252927; --x-line2: #353A37; --x-sel: #EBEEEC; --x-onsel: #0D0F0E; --x-pin: #5B8CFF; --x-onpin: #0B1220;
  --x-ok: #4CC27A; --x-bad: #FF7A6E; --x-shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 36px rgba(0,0,0,.45); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--x-bg); color: var(--x-ink); font: 14px/1.45 var(--x-font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--x-pin); outline-offset: 2px; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }

/* ---------- Toolbar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; background: color-mix(in oklab, var(--x-bg) 96%, transparent);
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid var(--x-line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mark { display: flex; align-items: center; gap: 8px; min-width: 0; margin-right: 8px; }
.top-in > .tools { margin-left: auto; }
.view-row { padding-block: 0 10px; gap: 8px 10px; }
.vlabel { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--x-ink3); margin-left: 6px; }
.vlabel:first-child { margin-left: 0; }
.xbtn.sm { height: 34px; }
.mark b { font: 600 15px/1 var(--x-display); letter-spacing: -.1px; }
.mark span { color: var(--x-ink2); font-size: 13px; white-space: nowrap; }
.mark .leaf { color: var(--x-ink); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
/* Presets: the designs, then the color themes */
.presets { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.seg { display: inline-flex; background: var(--x-panel2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 10px; border-radius: 7px; color: var(--x-ink2); font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--x-panel); color: var(--x-ink); box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 0 0 .5px var(--x-line2); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--x-ink); }
.dot2 { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px var(--x-line2); }
.xbtn { height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--x-line2); background: var(--x-panel); color: var(--x-ink);
  font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.xbtn:hover { border-color: var(--x-ink3); }
.xbtn.is-unavailable { opacity: .5; }
/* On/off switch: plain like an unselected option, so only the switch shows the state */
.xbtn.toggle { background: transparent; border-color: transparent; padding: 0 10px 0 8px; gap: 8px; }
.xbtn.toggle:hover { border-color: var(--x-line2); }
.xbtn.toggle .sw { position: relative; flex: none; width: 30px; height: 18px; border-radius: 9px; box-shadow: inset 0 0 0 1.5px var(--x-ink3); transition: background-color .15s, box-shadow .15s; }
.xbtn.toggle .sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--x-ink3); transition: transform .15s, background-color .15s; }
.xbtn.toggle[aria-checked="true"] .sw { background: var(--x-sel); box-shadow: inset 0 0 0 1.5px var(--x-sel); }
.xbtn.toggle[aria-checked="true"] .sw::after { background: var(--x-onsel); transform: translateX(12px); }
.xbtn[aria-pressed="true"] { background: var(--x-sel); color: var(--x-onsel); border-color: var(--x-sel); }
.xbtn.pin-on[aria-pressed="true"] { background: var(--x-pin); border-color: var(--x-pin); color: var(--x-onpin); }
.xbtn .count { font-variant-numeric: tabular-nums; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--x-panel2); color: var(--x-ink); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
.xbtn[aria-pressed="true"] .count { background: rgba(255,255,255,.22); color: inherit; }
.xbtn.icon { width: 34px; padding: 0; justify-content: center; }
.zoom { display: inline-flex; align-items: center; gap: 6px; color: var(--x-ink2); font-size: 12px; }
.zoom input { width: 84px; accent-color: var(--x-ink); }

/* ---------- Layout ---------- */
.shell { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 28px; padding-block: 0 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: padding .2s; }
body.dial-open .shell { padding-right: max(352px, env(safe-area-inset-right, 0px)); }
body.view-compare .shell { grid-template-columns: minmax(0, 1fr); }
body.view-compare .rail { display: none; }
.rail { position: sticky; top: 112px; align-self: start; display: flex; flex-direction: column; gap: 2px; padding-top: 28px; }
.rail a { color: var(--x-ink2); text-decoration: none; padding: 6px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; }
.rail a:hover { color: var(--x-ink); background: var(--x-panel2); }
.rail a.on { color: var(--x-ink); background: var(--x-panel); box-shadow: 0 0 0 1px var(--x-line); }
.rail .sub { padding-left: 22px; font-size: 12.5px; font-weight: 400; }
.rail hr { border: 0; border-top: 1px solid var(--x-line); margin: 10px 4px; width: auto; }
.rail .hint { font-size: 11.5px; color: var(--x-ink3); padding: 4px 10px; line-height: 1.5; }
.rail kbd, .kbd { font: 600 10.5px/1 var(--x-mono); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--x-line2); background: var(--x-panel); color: var(--x-ink2); }
main { min-width: 0; }

/* ---------- Sections ---------- */
.sec { padding-block: 36px 28px; border-bottom: 1px solid var(--x-line); scroll-margin-top: 108px; }
.sec:last-child { border-bottom: 0; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--x-ink3); margin: 0 0 6px; }
.sec h2 { font: 650 26px/1.15 var(--x-display); letter-spacing: -.3px; margin: 0 0 8px; text-wrap: balance; }
.sec h3 { font: 600 17px/1.3 var(--x-display); margin: 28px 0 4px; }
.lede { color: var(--x-ink2); max-width: 72ch; margin: 0 0 18px; font-size: 14.5px; }
.lede b, .rules b { color: var(--x-ink); font-weight: 600; }
.rules { margin: 6px 0 20px; padding-left: 18px; max-width: 80ch; color: var(--x-ink2); display: grid; gap: 4px; }
code { font: 12px var(--x-mono); background: var(--x-panel2); padding: 1px 5px; border-radius: 5px; color: var(--x-ink); }
.pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; align-items: start; }
.pairs.wide { grid-template-columns: repeat(auto-fit, minmax(min(100%, 640px), 1fr)); }
.pairs + h3 { margin-top: 32px; }
body.only-light .m-dark, body.only-dark .m-light { display: none !important; }
body.only-light .pairs, body.only-dark .pairs { grid-template-columns: minmax(0, 1fr); max-width: 760px; }

/* Overview */
.ov { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.ov-card { background: var(--x-panel); border: 1px solid var(--x-line); border-radius: 14px; padding: 18px; min-width: 0; }
.ov-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ov-name b { font: 700 34px/1 var(--x-display); letter-spacing: -.6px; }
.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--x-panel2); color: var(--x-ink2); font-size: 11.5px; font-weight: 600; }
.tag.mod { background: color-mix(in oklab, var(--x-pin) 16%, transparent); color: var(--x-pin); }
.ov-thesis { font-size: 15px; line-height: 1.55; color: var(--x-ink); max-width: 64ch; margin: 12px 0 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.facts span { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: var(--x-panel2); color: var(--x-ink2); }
.strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.strip-mode { border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.strip-mode .lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.sw-row { display: flex; gap: 4px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.25); }
.checks { width: 100%; border-collapse: collapse; font-size: 13px; }
.checks th { text-align: left; font-weight: 600; color: var(--x-ink3); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 0 6px 8px; }
.checks td { padding: 7px 6px; border-top: 1px solid var(--x-line); vertical-align: middle; }
.checks td.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; width: 1%; }
.ratio { display: inline-flex; align-items: center; gap: 5px; }
.ratio i { width: 7px; height: 7px; border-radius: 50%; background: var(--x-ok); }
.ratio.bad i { background: var(--x-bad); }
.ratio.bad { color: var(--x-bad); font-weight: 600; }
.diffs { margin: 0; padding-left: 18px; color: var(--x-ink2); display: grid; gap: 5px; }

/* Color table */
.ctable-wrap { overflow-x: auto; border: 1px solid var(--x-line); border-radius: 14px; background: var(--x-panel); }
.ctable { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
.ctable th { text-align: left; font-size: 11px; color: var(--x-ink3); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 12px 14px 8px; }
.ctable td { padding: 8px 14px; border-top: 1px solid var(--x-line); vertical-align: middle; }
.ctable .grp td { background: var(--x-panel2); font-weight: 600; font-size: 12px; color: var(--x-ink2); padding: 6px 14px; }
.chex { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 2px; cursor: pointer; font: 12px var(--x-mono); color: var(--x-ink); border-radius: 6px; }
.chex:hover { background: var(--x-panel2); }
.chex .sw { width: 26px; height: 26px; border-radius: 6px; }
.ctable td:first-child code { background: none; padding: 0; font-weight: 600; }
.ctable .role { color: var(--x-ink2); }
.ctable .swift { color: var(--x-ink3); font: 11.5px var(--x-mono); }

/* Boards and shots */
.board { background: var(--ground); color: var(--ink); border-radius: 18px; padding: 22px; position: relative; font-family: var(--f-text); min-width: 0;
  box-shadow: 0 0 0 1px var(--x-line); }
.board-tag { position: absolute; top: 10px; right: 14px; font: 600 10.5px/1 var(--x-font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
.shots { display: grid; gap: 28px; }
.shot-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.shot-head b { font: 600 15px var(--x-display); }
.shot-head code { font-size: 11.5px; color: var(--x-ink2); }
.shot-note { font-size: 11.5px; color: var(--x-ink2); font-style: italic; }
.shot-pair { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.dev-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 6px; }
.grp-title { font: 650 20px/1.2 var(--x-display); margin: 30px 0 14px; display: flex; align-items: center; gap: 10px; scroll-margin-top: 112px; }
.grp-title:first-of-type { margin-top: 8px; }

/* Section notes */
.notes { margin-top: 22px; border: 1px dashed var(--x-line2); border-radius: 12px; background: var(--x-panel); }
.notes summary { cursor: pointer; padding: 10px 14px; color: var(--x-ink2); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; list-style: none; }
.notes summary::-webkit-details-marker { display: none; }
.notes summary .has { color: var(--x-pin); font-weight: 600; }
.notes textarea { display: block; width: calc(100% - 28px); margin: 0 14px 14px; min-height: 90px; resize: vertical; border: 1px solid var(--x-line2); border-radius: 9px; background: var(--x-bg); color: var(--x-ink); padding: 10px 12px; font: 13.5px/1.5 var(--x-font); }

/* Compare */
.cmp-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 22px 0 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-x { border: 1px solid var(--x-line2); background: var(--x-panel); height: 30px; padding: 0 11px; border-radius: 15px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--x-ink2); }
.chip-x[aria-pressed="true"] { background: var(--x-sel); color: var(--x-onsel); border-color: var(--x-sel); }
.cmp-grid { display: grid; gap: 18px 22px; overflow-x: auto; padding-bottom: 12px; }
.cmp-col-head { display: grid; gap: 4px; align-content: start; }
.cmp-col-head b { font: 650 18px var(--x-display); display: flex; align-items: center; gap: 8px; }
.cmp-col-head p { margin: 0; color: var(--x-ink2); font-size: 12.5px; line-height: 1.45; max-width: 46ch; }
.cmp-cell { min-width: 0; }

/* ---------- Phone ---------- */
/* Device size and corner radius come from --dw, --dh and --dr on the wrapper (iPhone 17 Pro by default) */
.ph-wrap { width: calc((var(--dw, 402px) + 18px) * var(--zoom)); height: calc((var(--dh, 874px) + 18px) * var(--zoom)); flex: none; position: relative; }
.ph { position: absolute; top: 0; left: 0; margin: 0; width: calc(var(--dw, 402px) + 18px); height: calc(var(--dh, 874px) + 18px); transform: scale(var(--zoom)); transform-origin: 0 0; border-radius: calc(var(--dr, 51px) + 9px); padding: 9px; background: #0A0A0B;
  box-shadow: 0 0 0 1px #2A2A2D, 0 30px 60px -20px rgba(0,0,0,.35); flex: none; position: relative; isolation: isolate; }
.ph-screen { position: relative; width: var(--dw, 402px); height: var(--dh, 874px); border-radius: var(--dr, 51px); overflow: hidden; background: var(--ground); color: var(--ink);
  font-family: var(--f-text); font-size: var(--fs-body); line-height: 1.3; -webkit-font-smoothing: antialiased; text-align: left; }
.ph-status { position: absolute; top: 0; left: 0; right: 0; height: 54px; background: linear-gradient(var(--ground) 72%, transparent); display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 52px; z-index: 30; color: var(--ink); pointer-events: none; }
.ph-time { font: 600 17px/1 var(--f-text); letter-spacing: -.2px; }
.ph-sys { display: flex; gap: 6px; align-items: center; }
.ph-sys svg { fill: currentColor; }
.ph-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 31; }
.ph-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 58px var(--gutter) 44px; display: flex; flex-direction: column; gap: var(--gap); scrollbar-width: none; }
.ph-scroll::-webkit-scrollbar { display: none; }
.ph-scroll.has-tab { padding-bottom: 116px; }
.ph-scroll > *, .b-behind > * { flex-shrink: 0; }
.ph-home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; border-radius: 3px; background: var(--ink); z-index: 40; opacity: .92; }
.b-behind { display: contents; }

/* ---------- Birch components (token driven) ---------- */
.b-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.b-gap8 { gap: 8px; } .b-gap16 { gap: 16px; flex-wrap: wrap; }
.b-spacer { flex: 1; }
.b-grow { flex: 1; min-width: 0; }
.b-center { text-align: center; justify-content: center; align-self: center; }
.b-stack { display: flex; flex-direction: column; gap: calc(12px * var(--sp, 1)); }
.b-stack-s { display: flex; flex-direction: column; gap: 8px; }
.b-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.b-pad { padding: 4px var(--pad) var(--pad); }

.b-large { font: var(--w-title) 34px/41px var(--f-display); letter-spacing: -.5px; margin: 0; }
.b-title-xl { font: var(--w-title) 28px/34px var(--f-display); letter-spacing: -.4px; margin: 0; text-wrap: balance; }
.b-title { font: 600 22px/28px var(--f-display); letter-spacing: -.3px; margin: 2px 0 0; }
.b-title3 { font: 600 20px/25px var(--f-display); letter-spacing: -.2px; margin: 0; }
.b-head { font: 600 17px/22px var(--f-text); letter-spacing: -.2px; margin: 0; }
.b-body { font-size: var(--fs-body); line-height: 1.3; }
.b-sub { font-size: 15px; line-height: 20px; margin: 0; }
.b-foot { font-size: 13px; line-height: 18px; margin: 0; }
.b-cap { font-size: 12px; line-height: 16px; display: inline-flex; align-items: center; gap: 3px; }
.b-cap2 { font-size: 11px; line-height: 14px; font-weight: 500; }
.b-label { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink2); }
.b-help { font-size: 12px; line-height: 16px; color: var(--ink2); }
.b-mono { font-family: var(--f-mono); font-size: 13.5px; letter-spacing: -.1px; }
.b-num { font-variant-numeric: tabular-nums; }
.b-amt-xl { font: 700 40px/46px var(--f-amount); letter-spacing: -.8px; }
.b-amt-m { font: 600 24px/28px var(--f-amount); letter-spacing: -.3px; }
.b-amt-entry { font: 600 44px/50px var(--f-amount); letter-spacing: -.8px; }
.b-amt-row { font-size: 15px; font-weight: 600; letter-spacing: -.1px; }
.b-unit { color: var(--unit); font-size: .5em; font-weight: 600; letter-spacing: 0; }
.b-amt-m .b-unit { font-size: .62em; }
.b-unit-s { color: var(--ink2); font-weight: 500; font-size: .86em; }
.b-addr .a1 { color: var(--ink); } .b-addr .a2 { color: var(--ink2); }
.b-addr-block { line-height: 1.6; word-spacing: 1px; }
.b-ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-ink2 { color: var(--ink2); } .c-ink3 { color: var(--ink3); } .c-brand { color: var(--brandInk); } .c-accent { color: var(--accentInk); }
.c-success { color: var(--success); } .c-danger { color: var(--danger); }

.b-card { background: var(--card); border-radius: var(--r-card); padding: var(--pad); box-shadow: var(--cardShadow); min-width: 0; }
.b-card.flush { padding: 0; }
.b-card-title { font: 600 15px/20px var(--f-text); padding: 14px var(--pad) 2px; }
.b-divider { height: 1px; background: var(--line); flex: none; }
.b-divider.inset { margin-left: var(--pad); }
.b-list { display: flex; flex-direction: column; overflow: hidden; }
.b-li { display: flex; align-items: center; gap: 12px; min-height: calc(var(--row-h) - 15.33px); padding: 0 var(--pad); min-width: 0; }
.b-li.tight { min-height: 46px; }
.b-li-top { align-items: flex-start; padding-block: 12px; }
.b-li-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.b-li-main > .b-cap { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-li-trail { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.b-li-ic { width: 28px; height: 28px; display: grid; place-items: center; color: var(--ink2); }
.b-chev { margin-left: -2px; }
.b-dir { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--nested); color: var(--ink2); }
.b-dir.in { background: var(--successTint); color: var(--success); }
.b-status { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--ink2); }
.b-status.ok .ic { color: var(--success); }
.b-status.warn { color: var(--warning); }
.b-kv { display: flex; flex-direction: column; gap: 14px; }
.b-kv-row { display: flex; flex-direction: column; gap: 3px; }
.b-kv-v { min-width: 0; }

.b-home-top { display: flex; align-items: center; justify-content: space-between; }
.b-iconbtn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.b-iconbtn.round { background: var(--card); box-shadow: var(--cardShadow); }
.b-iconbtn-tonal { width: 46px; height: 46px; flex: none; border: 0; border-radius: var(--r-nested); background: var(--brandTint); color: var(--brandInk); display: grid; place-items: center; cursor: pointer; }
.b-iconbtn-tonal.neutral { background: var(--nested); color: var(--ink2); }
.b-wallet-pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 7px; border-radius: 18px; border: 0; background: var(--card); box-shadow: var(--cardShadow); color: var(--ink); font: 600 16px/1 var(--f-text); cursor: pointer; }
.b-ident { width: 22px; height: 22px; border-radius: 6px; overflow: hidden; display: inline-block; flex: none; }
.b-ident svg { width: 100%; height: 100%; display: block; }
.b-sync { width: 36px; height: 36px; display: grid; place-items: center; }
.b-sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 5px var(--successTint); }
.b-sync.idle i { background: var(--ink3); box-shadow: 0 0 0 5px var(--nested); }
.b-sync.syncing i { background: var(--progress); box-shadow: 0 0 0 5px var(--accentTint); animation: bpulse 1.4s ease-in-out infinite; }
.b-sync.err i { background: var(--danger); box-shadow: 0 0 0 5px var(--dangerTint); }
@keyframes bpulse { 50% { box-shadow: 0 0 0 9px transparent; } }
.b-hero { text-align: center; display: flex; flex-direction: column; gap: 2px; padding: 10px 0 2px; }
.b-hero-meta { display: flex; align-items: center; justify-content: space-between; }
.b-sec-head { margin-top: 6px; }
.b-navlarge { display: flex; align-items: center; justify-content: space-between; padding-top: 2px; }
.b-navinline { display: flex; align-items: center; justify-content: space-between; }
.b-setup-head { text-align: center; display: flex; flex-direction: column; gap: 6px; padding: 12px 6px 4px; }

.b-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.b-step { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 500; color: var(--ink3); }
.b-step i { height: 3px; border-radius: 2px; background: var(--line); }
.b-step.done { color: var(--ink2); } .b-step.done i { background: var(--progress); }
.b-step.on { color: var(--progress); font-weight: 600; } .b-step.on i { background: var(--progress); }
.b-progress { display: flex; gap: 6px; padding-top: 4px; }
.b-progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.b-progress i.done, .b-progress i.on { background: var(--progress); }

.b-chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: var(--r-chip); border: 0; font: 600 12px/1 var(--f-text); white-space: nowrap; background: var(--nested); color: var(--ink2); }
.b-chip.b-mono { font-family: var(--f-mono); font-weight: 500; font-size: 11.5px; }
.chip-net { --nc: var(--net_mainnet); --nct: var(--net_mainnetTint); background: var(--nct); color: var(--nc); }
.chip-net[data-net="testnet4"] { --nc: var(--net_testnet4); --nct: var(--net_testnet4Tint); }
.chip-net[data-net="testnet3"] { --nc: var(--net_testnet3); --nct: var(--net_testnet3Tint); }
.chip-net[data-net="signet"] { --nc: var(--net_signet); --nct: var(--net_signetTint); }
.chip-brand { background: var(--brandTint); color: var(--brandInk); }
.chip-accent { background: var(--accentTint); color: var(--accentInk); }
.chip-success { background: var(--successTint); color: var(--success); }
.chip-warning { background: var(--warningTint); color: var(--warning); }
.chip-info { background: var(--infoTint); color: var(--info); }

/* Buttons: tier styles that vary by preset are generated into #tokens */
.b-btn { appearance: none; border: 0; position: relative; height: var(--btn-h); padding: 0 20px; border-radius: var(--r-btn); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 600 17px/1 var(--f-text); letter-spacing: -.2px; cursor: pointer; white-space: nowrap; transition: transform .12s ease, filter .12s ease; -webkit-tap-highlight-color: transparent; }
.b-btn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0; pointer-events: none; transition: opacity .12s; }
.b-block { width: 100%; }
.b-primary { background: var(--brand); color: var(--onBrand); }
.b-primary.is-pressed, .b-primary:active { background: var(--brandPressed); }
.b-tertiary { background: transparent; color: var(--tert); height: 44px; padding: 0 12px; }
.b-quiet { color: var(--ink2); font-weight: 500; }
.b-tonal { background: var(--brandTint); color: var(--brandInk); height: 44px; font-size: 15px; padding: 0 16px; }
.b-tonal.neutral { background: var(--nested); color: var(--ink); }
.ph-scroll > .b-row .b-tonal.neutral, .b-footer .b-tonal.neutral, .pat-body > .b-footer .b-tonal.neutral, .mx .b-tonal.neutral { background: var(--card); box-shadow: var(--cardShadow); }
.b-tonal.on-tint { background: var(--card); color: var(--brandInk); box-shadow: none; }
.b-tonal.neutral.on-tint { color: var(--ink); }
.b-xs { height: 30px; font-size: 13px; padding: 0 10px; gap: 5px; border-radius: min(var(--r-btn), 9px); }
.b-sm { height: 34px; font-size: 15px; padding: 0 14px; border-radius: min(var(--r-btn), 10px); }
.b-danger { background: var(--dangerFill); color: var(--onDanger); }
.b-danger-ink { color: var(--danger); --secBorder: var(--danger); }
.b-spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: bspin .8s linear infinite; }
.b-mx.is-loading > span { visibility: hidden; }
.b-mx.is-loading .b-spin { position: absolute; }
@keyframes bspin { to { transform: rotate(360deg); } }
.b-footer { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.b-footer .b-tertiary { align-self: center; }
.b-footer.flat { margin: 0; }
.b-sheetbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.b-fieldset { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.b-field { display: flex; align-items: center; min-height: 46px; padding: 0 14px; border-radius: var(--r-nested); background: var(--nested); color: var(--ink); min-width: 0;
  box-shadow: inset 0 0 0 var(--stroke) var(--line); }
.b-field.b-placeholder { color: var(--ink3); }
.b-field.focus { box-shadow: inset 0 0 0 2px var(--focus); }
.b-field.error { box-shadow: inset 0 0 0 1.5px var(--danger); }
.b-textarea { align-items: flex-start; padding: 12px 14px; min-height: 86px; word-break: break-all; line-height: 1.5; font-size: 13px; }
.b-mini { min-height: 34px; width: 74px; justify-content: center; padding: 0 8px; font-size: 15px; }
.b-caret { display: inline-block; width: 2px; height: 1.15em; background: var(--focus); margin-left: 1px; vertical-align: text-bottom; animation: bblink 1.1s steps(1) infinite; }
@keyframes bblink { 50% { opacity: 0; } }
.b-seg { display: flex; padding: 3px; gap: 2px; border-radius: calc(var(--r-nested) + 1px); background: var(--nested); box-shadow: inset 0 0 0 var(--stroke) var(--line); }
.b-seg span { flex: 1; text-align: center; height: 32px; line-height: 32px; border-radius: max(calc(var(--r-nested) - 2px), 2px); font-size: 13px; font-weight: 500; color: var(--ink2); white-space: nowrap; }
.b-seg span.on { background: var(--segOn); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.b-toggle { width: 51px; height: 31px; border-radius: 16px; background: var(--toggleOff); position: relative; flex: none; transition: background .2s; }
.b-toggle i { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 5px rgba(0,0,0,.22); transition: left .2s; }
.b-toggle.on { background: var(--toggle); }
.b-toggle.on i { left: 22px; }
.b-radio { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1.5px var(--lineStrong); }
.b-radio.on { background: var(--select); box-shadow: inset 0 0 0 1.5px var(--select), inset 0 0 0 5.5px var(--card); }
.b-opt { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 var(--pad); background: var(--card); border-radius: var(--r-card); box-shadow: var(--cardShadow); }
.b-sel { background: linear-gradient(var(--selectTint), var(--selectTint)), var(--card); box-shadow: inset 0 0 0 1.5px var(--select); }
.b-stepper { display: inline-flex; align-items: center; background: var(--nested); border-radius: var(--r-nested); }
.b-stepper button { width: 38px; height: 32px; border: 0; background: transparent; color: var(--brandInk); display: grid; place-items: center; cursor: pointer; }
.b-stepper b { min-width: 24px; text-align: center; font: 600 17px var(--f-text); }
.b-quorum { display: flex; align-items: baseline; justify-content: center; gap: 12px; font-family: var(--f-amount); }
.b-quorum b { font-size: 52px; line-height: 1; font-weight: 600; color: var(--ink); }
.b-quorum span { font-size: 18px; color: var(--ink2); }

.b-callout { --k: var(--info); --kt: var(--infoTint); display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-nested); background: var(--kt); color: var(--ink); }
.b-callout.success { --k: var(--success); --kt: var(--successTint); }
.b-callout.warning { --k: var(--warning); --kt: var(--warningTint); }
.b-callout.danger { --k: var(--danger); --kt: var(--dangerTint); }
.ph-scroll > .b-callout { padding: var(--pad); border-radius: var(--r-card); }
.b-callout-ic { color: var(--k); margin-top: 1px; }
.b-callout-body { flex: 1; min-width: 0; }
.b-callout-title { font: 600 14.5px/19px var(--f-text); }
.b-callout-text { font-size: 12.5px; line-height: 17px; color: var(--ink2); margin-top: 3px; }
.b-callout-text b { color: var(--ink); }
.b-callout-actions { margin-top: 12px; }

.b-sigs { display: flex; gap: 8px; justify-content: center; }
.b-slot { width: 48px; height: 48px; border-radius: var(--r-nested); background: var(--card); box-shadow: inset 0 0 0 1px var(--lineStrong); display: grid; place-items: center; font: 500 14px var(--f-mono); color: var(--ink2); }
.b-slot.signed { background: var(--successTint); color: var(--success); box-shadow: inset 0 0 0 1.5px var(--success); }
.b-cslots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.b-cslot { height: 56px; border-radius: var(--r-nested); background: var(--card); box-shadow: var(--cardShadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink3); }
.b-cslot small { font: 600 11px var(--f-text); }
.b-cslot.done { background: var(--successTint); color: var(--success); box-shadow: none; }
.b-cslot.on { background: linear-gradient(var(--selectTint), var(--selectTint)), var(--card); color: var(--select); box-shadow: inset 0 0 0 1.5px var(--select); }
.b-qr-wrap { align-self: center; width: 300px; background: var(--qrBg); border-radius: var(--r-card); padding: 14px; box-shadow: var(--cardShadow); }
.b-qr-wrap.small { width: 168px; padding: 10px; box-shadow: none; }
.b-qr-svg { width: 100%; display: block; }
.b-frames { display: flex; gap: 4px; justify-content: center; margin-top: 10px; }
.b-frames i { width: 18px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.14); }
.b-frames i.on { background: rgba(0,0,0,.78); }
.b-viewfinder { position: relative; height: 270px; border-radius: var(--r-card); background: radial-gradient(120% 90% at 50% 40%, #3A3F3C, #0E100F); overflow: hidden; }
.b-viewfinder i { position: absolute; width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.92); }
.b-viewfinder .tl { top: 46px; left: 82px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
.b-viewfinder .tr { top: 46px; right: 82px; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; }
.b-viewfinder .bl { bottom: 46px; left: 82px; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; }
.b-viewfinder .br { bottom: 46px; right: 82px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
.b-vf-hint { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; color: rgba(255,255,255,.82); font-size: 12px; }
.b-meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.b-meter i { display: block; height: 100%; border-radius: 3px; background: var(--progress); }
.b-flow { width: 100%; height: auto; margin-top: 8px; display: block; }
.b-flow text { font: 10px var(--f-text); fill: var(--ink2); }
.b-total { display: flex; align-items: center; padding: 0 4px; }

.b-tabbar { position: absolute; left: 14px; right: 14px; bottom: 22px; height: 62px; border-radius: 31px; display: flex; padding: 4px; z-index: 20;
  background: var(--glass); backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6); box-shadow: 0 0 0 .5px var(--line), 0 8px 24px rgba(0,0,0,.14); }
.b-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 500 10px/1 var(--f-text); color: var(--ink); border-radius: 27px; }
.b-tab.on { color: var(--tabTint); background: var(--nested); font-weight: 600; }
.b-tabdemo { position: relative; height: 76px; }
.b-tabdemo .b-tabbar { left: 0; right: 0; bottom: 6px; }
.b-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 24; }
.b-sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 318px; z-index: 25; background: var(--ground); border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  padding: 8px var(--gutter) 40px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadowFloat); }
.b-grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--ink3); opacity: .55; align-self: center; flex: none; }
.b-menu { background: var(--floating); border-radius: var(--r-card); box-shadow: var(--shadowFloat); overflow: hidden; }
.b-menu-head { display: grid; grid-template-columns: 1fr auto 1fr; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--line); }
.b-menu-head span:last-child { text-align: right; }
.b-menu-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; font-size: 15px; }
.b-menu-item span:nth-child(2) { flex: 1; }
.b-menu-item.on { background: var(--selectTint); }
.b-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 24px 20px; }
.b-empty-ic { width: 54px; height: 54px; border-radius: 50%; background: var(--nested); color: var(--ink2); display: grid; place-items: center; margin-bottom: 4px; }
.b-toast { align-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--floating); box-shadow: var(--shadowFloat); font-size: 14px; font-weight: 500; }

/* Board helpers */
.board > .b-stack, .board > .b-card { max-width: 420px; }
.board[data-board="type"] > .b-card { max-width: none; }
.mx { display: grid; grid-template-columns: 128px repeat(4, minmax(96px, 1fr)); gap: 10px; align-items: center; min-width: 560px; }
.board[data-board="buttons"] { overflow-x: auto; }
.mx-head, .mx-row { display: contents; }
.mx-head span { font: 600 10.5px/1 var(--x-font); letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); padding-bottom: 2px; }
.mx-label { font-size: 12.5px; font-weight: 500; color: var(--ink2); }
.b-mx { width: 100%; padding: 0 10px; font-size: 15px; }
.pat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.pat-label { font: 600 11px/1 var(--x-font); letter-spacing: .07em; text-transform: uppercase; color: var(--ink3); margin-bottom: 10px; }
.type-list { overflow: hidden; }
.type-row { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 14px; align-items: center; padding: 12px var(--pad); border-top: 1px solid var(--line); }
.type-row:first-child { border-top: 0; }
.type-sample { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.type-meta { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--ink2); }
.type-meta code { background: none; padding: 0; color: var(--ink); font-size: 11.5px; font-family: var(--f-mono); }
.b-navdemo { padding-top: 2px; }

/* ---------- Comments ---------- */
body.commenting [data-c] { cursor: crosshair; }
body.commenting [data-c]:hover { outline: 2px dashed var(--x-pin); outline-offset: 2px; }
body.commenting [data-c]:hover [data-c]:not(:hover) { outline: 0; }
.pin-host { position: relative; }
.pin { position: absolute; z-index: 50; transform: translate(-50%, -50%); min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px 12px 12px 3px;
  background: var(--x-pin); color: var(--x-onpin); font: 700 12px/24px var(--x-font); text-align: center; box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(0,0,0,.3); cursor: pointer; border: 0; }
.ph .pin { min-width: 36px; height: 36px; font-size: 17px; line-height: 36px; border-radius: 18px 18px 18px 5px; box-shadow: 0 0 0 3px #fff, 0 6px 16px rgba(0,0,0,.3); }
.pin.resolved { background: var(--x-ink3); }
.pin.flash { animation: pinflash 1s ease 2; }
@keyframes pinflash { 50% { transform: translate(-50%, -50%) scale(1.5); } }

.pop { position: fixed; z-index: 90; width: min(340px, calc(100vw - 24px)); background: var(--x-panel); border: 1px solid var(--x-line); border-radius: 14px; box-shadow: var(--x-shadow); padding: 14px; display: grid; gap: 10px; }
.pop .ctx { font-size: 12px; color: var(--x-ink2); line-height: 1.45; }
.pop .ctx b { color: var(--x-ink); font-weight: 600; }
.pop textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--x-line2); border-radius: 9px; background: var(--x-bg); color: var(--x-ink); padding: 10px; font: 13.5px/1.5 var(--x-font); }
.pop .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pop .row .sp { flex: 1; }
.xbtn.primary { background: var(--x-sel); color: var(--x-onsel); border-color: var(--x-sel); }
.xbtn.danger { color: var(--x-bad); }
label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--x-ink2); cursor: pointer; }

/* Drawer */
.drawer { position: fixed; z-index: 80; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--x-panel); border-left: 1px solid var(--x-line); box-shadow: var(--x-shadow);
  display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--x-line); }
.drawer-head b { font: 650 16px var(--x-display); margin-right: auto; }
.drawer-body { overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; flex: 1; }
.cm { border: 1px solid var(--x-line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; background: var(--x-bg); }
.cm-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cm-n { min-width: 22px; height: 22px; border-radius: 11px 11px 11px 3px; background: var(--x-pin); color: var(--x-onpin); font: 700 11.5px/22px var(--x-font); text-align: center; padding: 0 5px; }
.cm-ctx { font-size: 12px; color: var(--x-ink2); }
.cm-text { white-space: pre-wrap; font-size: 13.5px; }
.cm-actions { display: flex; gap: 6px; }
.cm-actions button { border: 0; background: none; color: var(--x-ink2); font-size: 12px; cursor: pointer; padding: 2px 4px; border-radius: 5px; }
.cm-actions button:hover { color: var(--x-ink); background: var(--x-panel2); }
.empty-note { color: var(--x-ink2); font-size: 13px; border: 1px dashed var(--x-line2); border-radius: 12px; padding: 16px; line-height: 1.55; }
.export-pre { margin: 0; max-height: 46vh; overflow: auto; background: var(--x-bg); border: 1px solid var(--x-line); border-radius: 10px; padding: 12px; font: 11.5px/1.5 var(--x-mono); white-space: pre-wrap; word-break: break-word; }
.field-x { display: grid; gap: 6px; }
.field-x span { font-size: 12px; font-weight: 600; color: var(--x-ink2); }
.field-x textarea { min-height: 80px; resize: vertical; border: 1px solid var(--x-line2); border-radius: 9px; background: var(--x-bg); color: var(--x-ink); padding: 10px; font: 13.5px/1.5 var(--x-font); }
.confirm { border: 1px solid var(--x-bad); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; font-size: 13px; }

/* ---------- Tuning panel (DialKit-style) ---------- */
.dial { position: fixed; z-index: 70; top: 112px; right: max(14px, env(safe-area-inset-right, 0px)); width: 324px; max-height: calc(100vh - 126px); display: flex; flex-direction: column;
  background: var(--x-panel); border: 1px solid var(--x-line); border-radius: 16px; box-shadow: var(--x-shadow); overflow: hidden; font-size: 12.5px; }
.dial-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--x-line); }
.dial-head b { font: 650 13.5px var(--x-display); }
.dial-head .sp { flex: 1; }
.dial-sub { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--x-line); flex-wrap: wrap; }
.dial-body { overflow-y: auto; padding: 4px 0 10px; }
.mini { height: 26px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--x-line2); background: var(--x-panel); color: var(--x-ink2); font-size: 11.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.mini:hover { color: var(--x-ink); border-color: var(--x-ink3); }
.mini:disabled { opacity: .45; cursor: default; }
.dg { border-bottom: 1px solid var(--x-line); }
.dg:last-child { border-bottom: 0; }
.dg-head { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 0; background: none; cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--x-ink); text-align: left; }
.dg-head .ic { transition: transform .15s; color: var(--x-ink3); }
.dg[aria-expanded="false"] .dg-head .ic { transform: rotate(-90deg); }
.dg-head .sp { flex: 1; }
.dg-head .chg { font-size: 10.5px; font-weight: 600; color: var(--x-pin); }
.dg-head .sws { display: inline-flex; gap: 3px; }
.dg-head .sws i { width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(127,127,127,.3); }
.dg-body { padding: 2px 12px 10px; display: grid; gap: 4px; }
.dg[aria-expanded="false"] .dg-body { display: none; }
.dg-note { font-size: 11.5px; color: var(--x-ink2); background: var(--x-panel2); border-radius: 8px; padding: 8px 10px; line-height: 1.45; margin: 4px 0; }
.dg-note.top { margin: 8px 12px 4px; }
.dg-foot { font-size: 11px; color: var(--x-ink3); line-height: 1.45; margin-top: 4px; }
sup.only { color: var(--x-pin); font-weight: 700; margin-left: 1px; font-size: 10px; }
.dr-hint { grid-column: 1 / -1; font-size: 11px; color: var(--x-ink2); background: var(--x-panel2); border-radius: 6px; padding: 4px 8px; margin: 2px 0 4px; }
.mini.wide { width: 100%; justify-content: center; margin-top: 6px; height: 30px; color: var(--x-ink); font-weight: 600; }
.dr input:disabled, .dseg button:disabled { opacity: .4; cursor: not-allowed; }
.dr { display: grid; grid-template-columns: 96px minmax(0, 1fr) 50px; align-items: center; gap: 8px; min-height: 30px; }
.dr.seg-row { grid-template-columns: 96px minmax(0, 1fr); }
.dr-l { display: flex; align-items: center; gap: 5px; color: var(--x-ink2); min-width: 0; }
.dr-l span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-l .dirty { width: 7px; height: 7px; border-radius: 50%; background: var(--x-pin); border: 0; padding: 0; cursor: pointer; flex: none; }
.dr.is-dirty .dr-l { color: var(--x-ink); font-weight: 600; }
.dr input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; cursor: pointer; }
.dr input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--trk, var(--x-panel2)); box-shadow: inset 0 0 0 1px rgba(127,127,127,.18); }
.dr input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--trk, var(--x-panel2)); }
.dr input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 2px 5px rgba(0,0,0,.25); }
.dr input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 2px 5px rgba(0,0,0,.25); }
.dr input[type="number"] { width: 50px; height: 26px; border: 1px solid var(--x-line2); border-radius: 7px; background: var(--x-bg); color: var(--x-ink); font: 11.5px var(--x-mono); padding: 0 4px; text-align: right; -moz-appearance: textfield; }
.dr input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
.dseg { display: flex; background: var(--x-panel2); border-radius: 7px; padding: 2px; gap: 2px; }
.dseg button { flex: 1; border: 0; background: none; height: 22px; border-radius: 5px; font-size: 11.5px; color: var(--x-ink2); cursor: pointer; padding: 0 4px; white-space: nowrap; }
.dseg button[aria-pressed="true"] { background: var(--x-panel); color: var(--x-ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.dial-foot { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--x-line); flex-wrap: wrap; }
.dial-foot input { flex: 1; min-width: 0; height: 26px; border: 1px solid var(--x-line2); border-radius: 7px; background: var(--x-bg); color: var(--x-ink); padding: 0 8px; font-size: 12px; }

.toast-x { position: fixed; z-index: 100; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s;
  background: var(--x-sel); color: var(--x-onsel); padding: 9px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; pointer-events: none; }
.toast-x.show { opacity: 1; transform: translateX(-50%); }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  body.dial-open .shell { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .dial { top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); max-height: 56vh; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .ov { grid-template-columns: minmax(0, 1fr); }
  .dial { left: max(12px, env(safe-area-inset-left, 0px)); width: auto; }
  .mark span { display: none; }
  .zoom { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
