# Publishes design-system.html to GitHub Pages, with the screenshots from
# birch-screenshots for every device the page builds (iPhone 17 Pro, the iPhone
# Duo closed and open, iPad Pro 13-inch) so Overlay Screenshot works on the site.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  # Run by hand to pick up new screenshots without a change here
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the design system
        uses: actions/checkout@v7
        with:
          path: design

      - name: Check out the screenshots
        uses: actions/checkout@v7
        with:
          repository: Birch-Wallet/birch-screenshots
          path: shots
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /dark/en-US/iPhone 17 Pro-*.png
            /light/en-US/iPhone 17 Pro-*.png
            /dark/en-US/iPhone Duo (Closed)-*.png
            /light/en-US/iPhone Duo (Closed)-*.png
            /dark/en-US/iPhone Duo (Open)-*.png
            /light/en-US/iPhone Duo (Open)-*.png
            /dark/en-US/iPad Pro 13-inch (M5)-*.png
            /light/en-US/iPad Pro 13-inch (M5)-*.png

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R design/design-system.html design/assets _site/
          cp design/design-system.html _site/index.html
          # Each screen's screenshot (its shot starts with a digit) for each device (whose shot is the
          # screenshot name prefix), in both modes. Fail if one is missing, so Overlay never ships half broken
          grep -o "shot: '[A-Za-z][^']*'" design/assets/ds-shipped.js | cut -d"'" -f2 > devices.txt
          grep -o "shot: '[0-9][^']*'" design/assets/ds-shipped.js | cut -d"'" -f2 > shots.txt
          for mode in dark light; do
            mkdir -p "_site/screenshots/$mode/en-US"
            while read -r device; do
              while read -r shot; do
                f="shots/$mode/en-US/$device-$shot.png"
                test -f "$f" || { echo "Missing $mode screenshot: $device-$shot"; exit 1; }
                cp "$f" "_site/screenshots/$mode/en-US/"
              done < shots.txt
            done < devices.txt
          done
          du -sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
